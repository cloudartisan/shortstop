# Development stack. `docker compose up` gives you a working app on :3000 with
# your working tree live-mounted.
services:
  db:
    image: postgres:18-alpine
    volumes:
      # Postgres 18 wants the whole directory mounted, not the data subdirectory,
      # so that a future pg_upgrade --link does not cross a mount boundary.
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      # Local-only credential. Postgres is not published to the host; the app
      # reaches it over the compose network.
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      target: development
    command: ./bin/rails server -b 0.0.0.0 -p 3000
    volumes:
      # Mounted at the image's WORKDIR so edits actually reach the running app.
      - .:/rails
      # Keep the container's gems out of the bind mount.
      - bundle_cache:/usr/local/bundle
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: development
      POSTGRES_HOST: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shortstop_development

volumes:
  postgres_data:
  bundle_cache:
