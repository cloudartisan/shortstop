<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <title>Page not found (404) - Shortstop</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
      :root { color-scheme: light dark; }
      body {
        background: #f8f9fa; color: #212529;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex; flex-direction: column; min-height: 100vh; margin: 0;
      }
      header { background: #212529; color: #fff; padding: 1rem 0; }
      header .inner, main .inner { max-width: 40rem; margin: 0 auto; padding: 0 1.5rem; }
      header strong { font-size: 1.15rem; }
      main { flex: 1; display: flex; align-items: center; }
      .code { font-size: 0.8rem; letter-spacing: .1em; text-transform: uppercase; color: #6c757d; margin: 0 0 .5rem; }
      h1 { font-size: 1.75rem; margin: 0 0 .75rem; }
      p { line-height: 1.6; color: #495057; margin: 0 0 1.5rem; }
      a.btn {
        display: inline-block; background: #0d6efd; color: #fff; text-decoration: none;
        padding: .6rem 1.1rem; border-radius: .375rem; font-weight: 500;
      }
      a.btn:focus-visible { outline: 3px solid #9ec5fe; outline-offset: 2px; }
      @media (prefers-color-scheme: dark) {
        body { background: #16191c; color: #e9ecef; }
        p { color: #adb5bd; }
      }
    </style>
  </head>
  <body>
    <header><div class="inner"><strong>Shortstop</strong></div></header>
    <main>
      <div class="inner">
        <p class="code">Error 404</p>
        <h1>Page not found</h1>
        <p>That link does not exist, or it never did. It may have been mistyped, or the short link may have been removed.</p>
        <a class="btn" href="/">Shorten a URL</a>
      </div>
    </main>
  </body>
</html>
