# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/opt/homebrew/opt/libpq/bin/pg_config
#
# Every setting can be overridden from the environment, so the same file works
# for a local install, Docker Compose and CI without editing. Rails still lets
# DATABASE_URL override everything here if it is set.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("POSTGRES_HOST", "localhost") %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>
  username: <%= ENV["POSTGRES_USER"] %>
  password: <%= ENV["POSTGRES_PASSWORD"] %>

development:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "shortstop_development") %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_TEST_DB", "shortstop_test") %>

production:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "shortstop_production") %>
  username: <%= ENV.fetch("POSTGRES_USER", "shortstop") %>
  password: <%= ENV["SHORTSTOP_DATABASE_PASSWORD"] || ENV["POSTGRES_PASSWORD"] %>
